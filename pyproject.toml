[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pricescout"
version = "0.1.0"
description = "Agentic competitive price intelligence for German consumer electronics (MediaMarkt vs. competitors) using LangGraph and open-source LLMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM / agents
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.4",
    # scraping
    "playwright>=1.48",
    "httpx>=0.27",
    "selectolax>=1.0",
    # data
    "duckdb>=1.1",
    "polars>=1.10",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # dashboard
    "streamlit>=1.40",
    "plotly>=5.24",
    # utils
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "ipykernel>=6.29"]
# LoRA fine-tuning and the fine-tuned matcher (Apple Silicon only)
mlx = ["mlx-lm>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "C408",     # dict(...) is idiomatic for Plotly layout arguments
    "BLE001",   # batch jobs deliberately catch broad exceptions so one bad item can't stop a run
    "PERF402",  # we append one by one on purpose: a mid-loop failure keeps partial results
    "UP036",    # the Python-version guard in check_setup.py is a runtime check, not dead code
]
